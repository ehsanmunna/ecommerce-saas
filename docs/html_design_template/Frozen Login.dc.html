<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: rgb(255,255,255); -webkit-font-smoothing: antialiased; }
  a { color: rgb(37,43,66); text-decoration: none; }
  a:hover { color: rgb(229,160,0); }
  ::placeholder { color: rgb(164,164,164); }
</style>
</helmet>
<div style="width:100%; min-height:100vh; background:rgb(255,255,255); font-family:Inter, Helvetica, Arial, sans-serif; color:rgb(47,47,47); overflow-x:hidden; display:flex; flex-direction:column">

  <div style="display:flex; justify-content:center; padding:48px 24px 0">
    <a href="./Frozen Home.dc.html">
      <img src="./assets/logo.png" alt="Frozen" style="width:220px; height:48px; object-fit:contain" />
    </a>
  </div>

  <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:40px 24px">
    <div style="width:100%; max-width:440px; display:flex; flex-direction:column; gap:28px; padding:44px; border-radius:24px; background:rgb(255,255,255); box-shadow:0px 8px 30px 0px rgba(0,0,0,0.08); box-sizing:border-box">
      <div style="display:flex; flex-direction:column; gap:8px; text-align:center">
        <span style="font-size:28px; font-weight:700; color:rgb(47,47,47)">Welcome Back</span>
        <span style="font-size:14px; font-weight:400; color:rgb(115,115,115)">Sign in to continue to Frozen</span>
      </div>

      <div style="display:flex; flex-direction:column; gap:16px">
        <input value="{{ email }}" onChange="{{ onEmailChange }}" placeholder="Email address" style="{{ inputStyle }}" />
        <input value="{{ password }}" onChange="{{ onPasswordChange }}" type="password" placeholder="Password" style="{{ inputStyle }}" />
      </div>

      <div style="display:flex; align-items:center; justify-content:flex-end">
        <a href="./Frozen Forgot Password.dc.html" style="font-size:13px; font-weight:700; color:rgb(229,160,0)">Forgot password?</a>
      </div>

      <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}">
      <span style="font-size:13px; font-weight:600; color:rgb(214,69,69)">{{ error }}</span>
      </sc-if>

      <div style="height:51px; border-radius:20px; background:rgb(255,207,64); display:flex; align-items:center; justify-content:center; cursor:pointer" onClick="{{ signIn }}" style-hover="background:rgb(255,172,51)">
        <span style="font-size:16px; font-weight:700; color:rgb(54,54,54)">Sign In</span>
      </div>

      <div style="display:flex; align-items:center; gap:14px">
        <div style="flex:1; height:1px; background:rgb(230,230,230)"></div>
        <span style="font-size:12px; font-weight:600; color:rgb(164,164,164)">OR</span>
        <div style="flex:1; height:1px; background:rgb(230,230,230)"></div>
      </div>

      <div style="height:51px; border-radius:20px; border:2px solid rgb(230,230,230); display:flex; align-items:center; justify-content:center; cursor:pointer" style-hover="border-color:rgb(26,26,26)">
        <span style="font-size:15px; font-weight:700; color:rgb(47,47,47)">Continue with Google</span>
      </div>

      <div style="text-align:center; font-size:14px; font-weight:500; color:rgb(115,115,115)">
        Don't have an account? <a href="./Frozen Register.dc.html" style="color:rgb(229,160,0); font-weight:700">Sign up</a>
      </div>
    </div>
  </div>

  <div style="display:flex; justify-content:center; padding:32px 24px; font-size:13px; font-weight:400; color:rgb(164,164,164)">© 2026 Frozen. All rights reserved.</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const INPUT_STYLE = "height:51px; padding:0 18px; border-radius:16px; border:2px solid rgb(230,230,230); background:rgb(255,255,255); font-family:Inter, sans-serif; font-size:14px; color:rgb(47,47,47); box-sizing:border-box; outline:none";

class Component extends DCLogic {
  state = { email: "", password: "", error: "" };

  renderVals() {
    return {
      email: this.state.email,
      password: this.state.password,
      onEmailChange: (e) => this.setState({ email: e.target.value, error: "" }),
      onPasswordChange: (e) => this.setState({ password: e.target.value, error: "" }),
      inputStyle: INPUT_STYLE,
      error: this.state.error,
      signIn: () => {
        if (!this.state.email || !this.state.password) {
          this.setState({ error: "Please enter your email and password" });
        } else {
          this.setState({ error: "" });
        }
      },
    };
  }
}

</script>
</body>
</html>
